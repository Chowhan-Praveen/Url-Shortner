version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: url-shortener-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: url_shortener_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Web-based visual dashboard for MongoDB (Optional convenience)
  mongo-express:
    image: mongo-express:latest
    container_name: url-shortener-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: rootpassword
      ME_CONFIG_MONGODB_URL: mongodb://root:rootpassword@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb

volumes:
  mongo_data:
