# Spring Boot datasource configuration (defaults to local in-memory H2)
spring.application.name=url-shortener-analytics
server.port=8080

spring.datasource.url=${DB_URL:jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Custom application properties
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.short-code.length=6
app.short-code.max-retries=5