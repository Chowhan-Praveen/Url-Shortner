# ==============================================================================
# URL Shortener with Analytics - Application Configuration
# ==============================================================================

spring.application.name=url-shortener-analytics
server.port=8080

# Default Profile: H2 in-memory DB for instant zero-setup local execution
spring.datasource.url=jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate DDL auto-generation (create-drop, update, or validate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Custom application properties
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.short-code.length=6
app.short-code.max-retries=5
