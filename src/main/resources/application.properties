spring.config.import=optional:file:.env[.properties]
spring.application.name=url-shortener-analytics
server.port=8080

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/url_shortener_db}
spring.data.mongodb.database=${MONGODB_DATABASE:url_shortener_db}
spring.data.mongodb.auto-index-creation=true
logging.level.org.mongodb.driver=WARN

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.short-code.length=6
app.short-code.max-retries=5
