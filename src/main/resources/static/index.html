<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwiftURL - URL Shortener with Real-Time Analytics</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>SwiftURL</h1>
      <p>High-performance URL Shortener &amp; Real-Time Click Analytics</p>
    </header>

    <!-- Shorten URL Form Card -->
    <div class="card">
      <form id="shortenForm">
        <div class="form-grid">
          <div>
            <label for="originalUrl">Enter Destination Long URL *</label>
            <input type="url" id="originalUrl" placeholder="https://example.com/very/long/article/or/resource" required>
          </div>
          <div class="form-row">
            <div>
              <label for="customAlias">Custom Alias (Optional)</label>
              <input type="text" id="customAlias" placeholder="e.g. spring-boot-guide" pattern="[a-zA-Z0-9_-]{3,20}">
            </div>
            <div>
              <label for="expirationDays">Expiration</label>
              <select id="expirationDays">
                <option value="">Never Expires</option>
                <option value="1">1 Day</option>
                <option value="7">7 Days</option>
                <option value="30">30 Days</option>
                <option value="90">90 Days</option>
              </select>
            </div>
            <div style="display: flex; align-items: flex-end;">
              <button type="submit" class="btn btn-primary" style="width: 100%; height: 44px;" id="submitBtn">
                Shorten URL
              </button>
            </div>
          </div>
        </div>
      </form>

      <!-- Shortened Result Box -->
      <div id="resultBox" class="result-box">
        <div class="result-content">
          <div>
            <span style="font-size: 0.85rem; color: #34d399; font-weight: 600;">Short link generated successfully!</span>
            <div>
              <a id="shortLinkAnchor" href="#" target="_blank" class="short-url-link"></a>
            </div>
          </div>
          <div style="display: flex; gap: 0.5rem;">
            <button id="copyBtn" class="btn btn-secondary">Copy Link</button>
            <a id="analyticsBtn" href="#" class="btn btn-primary">View Analytics</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Active URLs Table Card -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
        <h2 style="font-size: 1.35rem; font-weight: 700;">Recent URLs &amp; Activity</h2>
        <button id="refreshBtn" class="btn btn-secondary btn-sm">&#x21bb; Refresh</button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Short Code</th>
              <th>Target URL</th>
              <th>Clicks</th>
              <th>Status</th>
              <th>Created</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="urlsTableBody">
            <tr>
              <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 2rem;">Loading links...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
